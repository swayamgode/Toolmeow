<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="50%" stop-color="#0F0F17" />
      <stop offset="100%" stop-color="#09090D" />
    </linearGradient>

    <!-- Vibrant Cat Glow Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Inner Ear Accent Gradient -->
    <linearGradient id="earGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- Eyes Gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366F1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" stroke="#312E81" stroke-width="4" />

  <!-- Subtle Inner Ambient Rim -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Cat Head Group with Glow Filter -->
  <g filter="url(#glowFilter)">
    <!-- Cat Ears & Face Silhouette Base -->
    <path
      d="M 120 130 
         C 130 180, 160 210, 180 230 
         C 220 220, 292 220, 332 230 
         C 352 210, 382 180, 392 130 
         C 415 210, 410 270, 395 320 
         C 365 390, 305 410, 256 410 
         C 207 410, 147 390, 117 320 
         C 102 270, 97 210, 120 130 Z"
      fill="url(#primaryGlow)"
    />

    <!-- Left Inner Ear Accent -->
    <path
      d="M 148 165 
         C 158 195, 175 215, 192 225 
         C 170 225, 145 200, 148 165 Z"
      fill="url(#earGlow)"
      opacity="0.9"
    />

    <!-- Right Inner Ear Accent -->
    <path
      d="M 364 165 
         C 354 195, 337 215, 320 225 
         C 342 225, 367 200, 364 165 Z"
      fill="url(#earGlow)"
      opacity="0.9"
    />

    <!-- Left Eye (Big Cute Almond Shape) -->
    <ellipse cx="196" cy="295" rx="22" ry="30" fill="#0F0F17" />
    <ellipse cx="196" cy="295" rx="18" ry="26" fill="url(#eyeGrad)" />
    <!-- Left Eye Sparkle -->
    <circle cx="190" cy="285" r="7" fill="#FFFFFF" />
    <circle cx="204" cy="305" r="3.5" fill="#FFFFFF" />

    <!-- Right Eye (Playful Wink or Almond Eye) -->
    <ellipse cx="316" cy="295" rx="22" ry="30" fill="#0F0F17" />
    <ellipse cx="316" cy="295" rx="18" ry="26" fill="url(#eyeGrad)" />
    <!-- Right Eye Sparkle -->
    <circle cx="310" cy="285" r="7" fill="#FFFFFF" />
    <circle cx="324" cy="305" r="3.5" fill="#FFFFFF" />

    <!-- Cute Nose -->
    <polygon points="256,335 246,322 266,322" fill="#FDA4AF" rx="2" />

    <!-- Cute Mouth (w) -->
    <path
      d="M 246 337 C 246 348, 234 352, 224 348 M 266 337 C 266 348, 278 352, 288 348"
      fill="none"
      stroke="#0F0F17"
      stroke-width="5"
      stroke-linecap="round"
    />

    <!-- Cute Whiskers Left -->
    <path d="M 125 315 Q 160 320 185 325" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 120 335 Q 155 335 182 335" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

    <!-- Cute Whiskers Right -->
    <path d="M 387 315 Q 352 320 327 325" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 392 335 Q 357 335 330 335" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Golden Tool Star / Sparkle in Top Right -->
  <g transform="translate(370, 75) scale(0.9)">
    <path
      d="M 25 0 L 32 18 L 50 25 L 32 32 L 25 50 L 18 32 L 0 25 L 18 18 Z"
      fill="#FBBF24"
    />
    <circle cx="25" cy="25" r="5" fill="#FEF08A" />
  </g>
</svg>

